name: Refresh Bun lockfile for blog editor branch

on:
  push:
    branches:
      - feat/blog-rich-editor

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blog-rich-editor
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate and validate Bun lockfile
        run: bun install
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lockfile for blog editor dependencies"
          git push origin HEAD:feat/blog-rich-editor
