name: Security Verification

on:
  push:
    branches:
      - main
      - ci/security-lint-verification
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build website
        run: npm run build
