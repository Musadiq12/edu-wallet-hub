name: Deploy Edu Wallet to Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Verify Cloudflare build output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Deploy storefront Worker to Cloudflare
        run: npx wrangler deploy --config .output/server/wrangler.json --name edu-wallet-hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
