name: Deploy EduWallet to Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://jlzownnxzdwwfylaqqcn.supabase.co
      VITE_SUPABASE_URL: https://jlzownnxzdwwfylaqqcn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_sajuPlI-7t5OGpKTts9LwA_Ct_3zbZ4
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Validate Supabase configuration
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing VITE_SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Verify Cloudflare build output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Prepare Cloudflare runtime environment
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = ".output/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.compatibility_flags = [...new Set([
            ...(config.compatibility_flags ?? []),
            "nodejs_compat",
            "nodejs_compat_populate_process_env",
          ])];
          config.vars = {
            ...(config.vars ?? {}),
            SUPABASE_URL: process.env.SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY: process.env.VITE_SUPABASE_PUBLISHABLE_KEY,
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Set server-side Supabase secret
        shell: bash
        run: |
          if [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name edu-wallet-hub
          else
            echo "GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY is empty or unavailable; preserving the existing Cloudflare Worker secret."
          fi

      - name: Deploy storefront Worker to Cloudflare
        run: npx wrangler deploy --config .output/server/wrangler.json --name edu-wallet-hub
